server:
  address: ${SERVER_ADDRESS:${APP_BIND_HOST:127.0.0.1}}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: ospysin-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${POSTGRES_DB:ospysin}
    username: ${SPRING_DATASOURCE_USERNAME:${APP_DB_USER:ospysin_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${APP_DB_PASSWORD:ospysin_app_secret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${POSTGRES_DB:ospysin}
    user: ${SPRING_FLYWAY_USER:${FLYWAY_USER:ospysin_admin}}
    password: ${SPRING_FLYWAY_PASSWORD:${FLYWAY_PASSWORD:ospysin_admin_secret}}
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

ospysin:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:hf.co/RavichandranJ/Dolphin3-Cyber-8B-GGUF:Q4_K_M}
    timeout-seconds: 60
