services:
  postgres:
    image: postgres:16-alpine
    container_name: ospysin-postgres
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ospysin}
      POSTGRES_USER: ${POSTGRES_USER:-ospysin_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secret_locally}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ospysin_admin} -d ${POSTGRES_DB:-ospysin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ospysin-backend
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ospysin}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ospysin}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-ospysin_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_secret_locally}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ospysin}
      SPRING_FLYWAY_USER: ${FLYWAY_USER:-flyway_user}
      SPRING_FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-flyway_secret_locally}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin_secret_locally}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/RavichandranJ/Dolphin3-Cyber-8B-GGUF:Q4_K_M}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ospysin-frontend
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
